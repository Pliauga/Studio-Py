      - {type: predict_output, id: w15-predict-resend-history}
    orphan: false
  - id: w12-trap-wp2-2-constructing-client-before
    week: 12
    waypoint: w12-wp2
    kind: misconception
    text: "Constructing the client before checking that a key exists. `openai.OpenAIError: Missing credentials` is a confusing way to learn about ordering."
    tested_by:
      - {type: py_exercise, id: w12-resend-history}
      - {type: predict_output, id: w15-predict-resend-history}
    orphan: false
  - id: w12-trap-wp2-3-assuming-calls-free
    week: 12
    waypoint: w12-wp2
    kind: operational
    text: "Assuming the calls are free. They are metered. Use `gpt-4o-mini` while developing and set a spending limit before you leave it running."
    tested_by:
      - {type: py_exercise, id: w12-resend-history}
      - {type: predict_output, id: w15-predict-resend-history}
    orphan: false
  - id: w12-trap-wp3-1-only-testing-happy
    week: 12
    waypoint: w12-wp3
    kind: misconception
    text: "Only testing the happy path. The bug at exactly 100 ships because every test used 150."
    tested_by:
      - {type: py_exercise, id: w12-threshold-edge}
    orphan: false
  - id: w12-trap-wp3-2-calling-real-paid
    week: 12
    waypoint: w12-wp3
    kind: misconception
    text: "Calling the real, paid API inside a test. It is slow, it costs money, and it fails when the network does, which teaches you nothing about your code."
    tested_by:
      - {type: py_exercise, id: w12-threshold-edge}
    orphan: false
  - id: w12-trap-wp3-3-test-function-no
    week: 12
    waypoint: w12-wp3
    kind: misconception
    text: "A test function with no `assert`. It passes, it checks nothing, and it counts as coverage."
    tested_by:
      - {type: py_exercise, id: w12-threshold-edge}
    orphan: false
  - id: w12-trap-wp3-4-one-giant-test
    week: 12
    waypoint: w12-wp3
    kind: misconception
    text: "One giant test asserting everything. When it fails you get a line number and no idea which behaviour broke."
    tested_by:
      - {type: py_exercise, id: w12-threshold-edge}
    orphan: false
  - id: w12-trap-wp4-1-committing-db-file
    week: 12
    waypoint: w12-wp4
    kind: security
    text: "Committing the `.db` file. Real hashed passwords are now in public history. `.gitignore` stops the next commit; it does not remove the last one."
    tested_by: []
    orphan: true
    rationale: "Operational deployment/repository hygiene rule in a non-exercise waypoint outside the frozen Phase 2 warm-up scope."
