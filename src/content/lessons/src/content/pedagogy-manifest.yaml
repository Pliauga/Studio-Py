  - id: w09-trap-wp4-6-private-repo-secret
    week: 9
    waypoint: w09-wp4
    kind: security
    text: "A private repo is not a secret store. Collaborators, forks and future public switches all see it. Treat every repo as if it could become public."
    tested_by:
      - {type: py_exercise, id: w09-store-split}
      - {type: py_exercise, id: w09-env-read}
      - {type: predict_output, id: w12-predict-register-toctou}
    orphan: false
  - id: w10-trap-wp1-1-dropping-if-exists
    week: 10
    waypoint: w10-wp1
    kind: runtime_error
    text: "Dropping `IF NOT EXISTS`. The second run of your script dies with `sqlite3.OperationalError: table devices already exists`, and you will run it more than once."
    tested_by:
      - {type: predict_output, id: w13-predict-update-where}
    orphan: false
  - id: w10-trap-wp1-2-reading-null-has
    week: 10
    waypoint: w10-wp1
    kind: runtime_error
    text: "Reading `NOT NULL` as \"has a default\". It means you must supply a value, or the insert raises `IntegrityError`."
    tested_by:
      - {type: predict_output, id: w13-predict-update-where}
    orphan: false
  - id: w10-trap-wp1-3-misspelling-column-create
    week: 10
    waypoint: w10-wp1
    kind: misconception
    text: "Misspelling a column in the `CREATE`. SQLite does not check that name against anything until an insert or a query mentions it, so the mistake surfaces a long way from its cause."
    tested_by:
      - {type: predict_output, id: w13-predict-update-where}
    orphan: false
  - id: w10-trap-wp1-4-using-type-sqlite
    week: 10
    waypoint: w10-wp1
    kind: misconception
    text: "Using a type SQLite does not have. It is permissive enough to accept almost anything, which leaves you with a schema that lies about your data. Stick to `INTEGER`, `TEXT`, `REAL`, `BLOB`."
    tested_by:
      - {type: predict_output, id: w13-predict-update-where}
    orphan: false
  - id: w10-trap-wp2-1-1-instead-1
    week: 10
    waypoint: w10-wp2
    kind: misconception
    text: "`(1)` instead of `(1,)`. You passed a number where a sequence of values was expected, and the binding fails or binds the wrong thing."
    tested_by:
      - {type: py_exercise, id: w10-one-item-tuple}
      - {type: predict_output, id: w14-predict-one-item-tuple}
    orphan: false
  - id: w10-trap-wp2-2-remembering-conn-commits
    week: 10
    waypoint: w10-wp2
    kind: runtime_error
    text: "Remembering that `with conn:` commits or rolls back the transaction on exit, but does not close the connection. If you call `conn.close()` yourself and then use a cursor from that connection, `ProgrammingError: Cannot operate on a closed database` is what you get."
    tested_by:
      - {type: py_exercise, id: w10-one-item-tuple}
      - {type: predict_output, id: w14-predict-one-item-tuple}
    orphan: false
  - id: w10-trap-wp2-3-assuming-fetchall-hands
    week: 10
    waypoint: w10-wp2
    kind: misconception
    text: "Assuming `fetchall()` hands back dictionaries. It hands back tuples. Index by position, or set a `row_factory` if you want names."
    tested_by:
      - {type: py_exercise, id: w10-one-item-tuple}
      - {type: predict_output, id: w14-predict-one-item-tuple}
    orphan: false
  - id: w10-trap-wp3-1-writing-set-before
    week: 10
    waypoint: w10-wp3
    kind: misconception
    text: "Writing the `SET` before the `WHERE`. Write the `WHERE` first, then fill in the change, so it is never missing."
    tested_by:
      - {type: predict_output, id: w13-predict-update-where}
    orphan: false
  - id: w10-trap-wp3-2-delete-devices-sql
    week: 10
    waypoint: w10-wp3
    kind: misconception
    text: "`DELETE * FROM devices`. That is not SQL. The star belongs to `SELECT`; `DELETE FROM` takes no column list."
    tested_by:
      - {type: predict_output, id: w13-predict-update-where}
    orphan: false
  - id: w10-trap-wp3-3-testing-filter-running
    week: 10
    waypoint: w10-wp3
    kind: misconception
    text: "Testing a filter by running the statement without it. Run a `SELECT` with the same `WHERE` first and look at the rows you are about to destroy."
    tested_by:
      - {type: predict_output, id: w13-predict-update-where}
    orphan: false
  - id: w10-trap-wp3-4-reusing-same-cursor
    week: 10
    waypoint: w10-wp3
    kind: misconception
    text: "Reusing the same cursor for a second query while you are still iterating the first result set. Finish reading one before starting the next."
    tested_by:
      - {type: predict_output, id: w13-predict-update-where}
    orphan: false
  - id: w10-trap-wp4-1-wrapping-placeholder-quotes
    week: 10
    waypoint: w10-wp4
    kind: misconception
    text: "Wrapping the placeholder in quotes, as in `VALUES ('?')`. That inserts the literal question mark. Placeholders are never quoted."
    tested_by:
      - {type: py_exercise, id: w10-parameterise-the-filter}
      - {type: predict_output, id: w12-predict-sql-placeholder}
    orphan: false
  - id: w10-trap-wp4-2-thinking-only-internal
    week: 10
    waypoint: w10-wp4
    kind: misconception
    text: "Thinking \"it is only an internal tool\". The habit travels to the public tool, and the public tool is where the quotes arrive."
    tested_by:
      - {type: py_exercise, id: w10-parameterise-the-filter}
      - {type: predict_output, id: w12-predict-sql-placeholder}
    orphan: false
  - id: w10-trap-wp4-3-waiting-error-tell
    week: 10
    waypoint: w10-wp4
    kind: security
    text: "Waiting for an error to tell you something went wrong. Injection does not raise. It returns the wrong rows, quietly, and you ship it."
    tested_by:
      - {type: py_exercise, id: w10-parameterise-the-filter}
      - {type: predict_output, id: w12-predict-sql-placeholder}
    orphan: false
  - id: w11-trap-wp1-1-using-plain-variable
    week: 11
    waypoint: w11-wp1
