    week: 12
    waypoint: w12-wp4
    kind: operational
    text: "Deploying without a fresh clone test. Your working directory has files the repository does not, and the cloud has none of them."
    tested_by: []
    orphan: true
    rationale: "Operational deployment/repository hygiene rule in a non-exercise waypoint outside the frozen Phase 2 warm-up scope."
  - id: w12-trap-wp4-4-assuming-works-my
    week: 12
    waypoint: w12-wp4
    kind: operational
    text: "Assuming \"it works on my machine\" is a status. It is a description of your machine."
    tested_by: []
    orphan: true
    rationale: "Operational deployment/repository hygiene rule in a non-exercise waypoint outside the frozen Phase 2 warm-up scope."
  - id: w13-trap-wp2-1-leaving-out-type
    week: 13
    waypoint: w13-wp2
    kind: runtime_error
    text: "Leaving out `type=float` or `type=int` on numeric flags. `args.warn_at` arrives as the string `\"85\"`, and comparing it against a float raises `TypeError`."
    tested_by:
      - {type: py_exercise, id: w13-argparse-flags}
    orphan: false
  - id: w13-trap-wp2-2-using-type-bool
    week: 13
    waypoint: w13-wp2
    kind: misconception
    text: "Using `type=bool` for a flag. `bool(\"False\")` is `True` because any non-empty string is truthy in Python. Use `action=\"store_true\"` instead."
    tested_by:
      - {type: py_exercise, id: w13-argparse-flags}
    orphan: false
  - id: w13-trap-wp2-3-calling-parser-parse
    week: 13
    waypoint: w13-wp2
    kind: misconception
    text: "Calling `parser.parse_args()` at module import level. Anyone importing a helper from your script triggers CLI parsing on their own `sys.argv`. Keep it inside `main()`."
    tested_by:
      - {type: py_exercise, id: w13-argparse-flags}
    orphan: false
  - id: w13-trap-wp3-1-printing-error-banners
    week: 13
    waypoint: w13-wp3
    kind: misconception
    text: "Printing error banners to `stdout`. The next script in the pipeline tries to parse `\"Error: file missing\"` as a hostname row."
    tested_by:
      - {type: py_exercise, id: w13-exit-code-contract}
    orphan: false
  - id: w13-trap-wp3-2-returning-true-false
    week: 13
    waypoint: w13-wp3
    kind: misconception
    text: "Returning `True` or `False` as a shell exit code. In Unix, `0` is success and `1` is failure\u2014the exact opposite of Python's boolean `int(True) == 1`."
    tested_by:
      - {type: py_exercise, id: w13-exit-code-contract}
    orphan: false
