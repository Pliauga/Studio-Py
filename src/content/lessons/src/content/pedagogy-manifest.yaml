traps:
  - id: w01-trap-wp2-1-190-10-evaluates
    week: 1
    waypoint: w01-wp2
    kind: misconception
    text: "`\"190\" + \"10\"` evaluates to `\"19010\"`, not `200`. No error is raised when both sides are strings."
    tested_by:
      - {type: py_exercise, id: w01-cast-before-math}
      - {type: predict_output, id: w04-predict-fstring-cast}
    orphan: false
  - id: w01-trap-wp2-2-190-10-raises
    week: 1
    waypoint: w01-wp2
    kind: runtime_error
    text: "`\"190\" + 10` raises `TypeError`. Convert the string with `int()` or `float()` first."
    tested_by:
      - {type: py_exercise, id: w01-cast-before-math}
      - {type: predict_output, id: w04-predict-fstring-cast}
    orphan: false
  - id: w01-trap-wp2-3-int-87-5
    week: 1
    waypoint: w01-wp2
    kind: runtime_error
    text: "`int(\"87.5\")` raises `ValueError`. Parse decimal strings with `float(\"87.5\")` first, then convert to `int()` if you want truncation."
    tested_by:
      - {type: py_exercise, id: w01-cast-before-math}
      - {type: predict_output, id: w04-predict-fstring-cast}
    orphan: false
  - id: w01-trap-wp2-4-quotes-around-variable
    week: 1
    waypoint: w01-wp2
    kind: misconception
    text: "Quotes around a variable name (`print(\"hostname\")`) print the literal word `hostname` instead of the value stored in it."
    tested_by:
      - {type: py_exercise, id: w01-cast-before-math}
      - {type: predict_output, id: w04-predict-fstring-cast}
    orphan: false
  - id: w01-trap-wp4-1-omitting-leading-f
    week: 1
    waypoint: w01-wp4
    kind: misconception
    text: "Omitting the leading `f` before the quote prints the literal characters `{hostname}` instead of the variable's value."
    tested_by:
      - {type: py_exercise, id: w01-fstring-report}
      - {type: predict_output, id: w04-predict-fstring-cast}
    orphan: false
  - id: w01-trap-wp4-2-using-exponentiation-2
    week: 1
    waypoint: w01-wp4
    kind: misconception
    text: "Using `^` for exponentiation (`2 ^ 3`) performs bitwise XOR (`1`), not powers. Use `**`."
    tested_by:
      - {type: py_exercise, id: w01-fstring-report}
      - {type: predict_output, id: w04-predict-fstring-cast}
    orphan: false
  - id: w01-trap-wp4-3-dividing-zero-used
    week: 1
    waypoint: w01-wp4
    kind: runtime_error
    text: "Dividing by zero (`used / 0`) immediately halts the script with `ZeroDivisionError`."
    tested_by:
      - {type: py_exercise, id: w01-fstring-report}
      - {type: predict_output, id: w04-predict-fstring-cast}
    orphan: false
  - id: w02-trap-wp2-1-if-x-5
    week: 2
    waypoint: w02-wp2
    kind: syntax_error
    text: "`if x = 5:` is a `SyntaxError`. `=` stores, `==` asks. Same for `while count = 5:`."
    tested_by:
      - {type: py_exercise, id: w02-elif-order}
      - {type: predict_output, id: w05-predict-elif-shadow}
    orphan: false
  - id: w02-trap-wp2-2-every-if-elif
    week: 2
    waypoint: w02-wp2
    kind: syntax_error
    text: "Every `if`, `elif`, and `else` line ends with a colon. Missing it is a `SyntaxError`, not a warning."
    tested_by:
      - {type: py_exercise, id: w02-elif-order}
      - {type: predict_output, id: w05-predict-elif-shadow}
    orphan: false
  - id: w02-trap-wp2-3-line-after-colon
    week: 2
    waypoint: w02-wp2
    kind: syntax_error
    text: "The line after the colon must be indented four spaces. Python will not guess what you meant, it stops with `IndentationError`."
    tested_by:
      - {type: py_exercise, id: w02-elif-order}
      - {type: predict_output, id: w05-predict-elif-shadow}
    orphan: false
  - id: w02-trap-wp2-4-broad-condition-above
    week: 2
    waypoint: w02-wp2
    kind: misconception
    text: "A broad condition above a specific one runs the wrong branch and tells you nothing. Reorder the chain, do not add another `if`."
    tested_by:
      - {type: py_exercise, id: w02-elif-order}
      - {type: predict_output, id: w05-predict-elif-shadow}
    orphan: false
  - id: w02-trap-wp2-5-20-20-false
    week: 2
    waypoint: w02-wp2
    kind: misconception
    text: "`\"20\" == 20` is `False`. Cast before you compare anything that came out of a file or a form."
    tested_by:
      - {type: py_exercise, id: w02-elif-order}
      - {type: predict_output, id: w05-predict-elif-shadow}
    orphan: false
  - id: w02-trap-wp3-1-forget-update-what
    week: 2
    waypoint: w02-wp3
    kind: misconception
    text: "Forget to update what the condition checks and you get an infinite loop with no error at all."
    tested_by:
      - {type: predict_output, id: w04-predict-while-continue}
    orphan: false
  - id: w02-trap-wp3-2-every-while-true
    week: 2
    waypoint: w02-wp3
    kind: misconception
