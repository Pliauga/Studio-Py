  - id: w11-trap-wp1-2-assuming-only-clicked
    week: 11
    waypoint: w11-wp1
    kind: misconception
    text: "Assuming only the clicked widget's code runs again. The whole file runs, every time, including the slow parts."
    tested_by:
      - {type: py_exercise, id: w11-session-state-counter}
      - {type: predict_output, id: w13-predict-session-rerun}
    orphan: false
  - id: w11-trap-wp1-3-forgetting-if-key
    week: 11
    waypoint: w11-wp1
