    waypoint: w13-wp3
    kind: misconception
    text: "Calling `sys.exit()` deep inside business logic, which makes unit tests terminate unless they catch `SystemExit`. Return an integer from `main()` instead."
    tested_by:
      - {type: py_exercise, id: w13-exit-code-contract}
    orphan: false
