    waypoint: w12-wp4
    kind: security
    text: "Putting secrets in a file and deploying anyway. The repository is public the moment you connect it."
    tested_by: []
    orphan: true
    rationale: "Operational deployment/repository hygiene rule in a non-exercise waypoint outside the frozen Phase 2 warm-up scope."
