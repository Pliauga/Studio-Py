      - {type: predict_output, id: w08-predict-groupby-mean}
    orphan: false
  - id: w06-trap-wp3-4-old-index-travels
    week: 6
    waypoint: w06-wp3
    kind: misconception
    text: "The old index travels with the sorted rows. Add `.reset_index(drop=True)` when you want fresh numbering."
    tested_by:
      - {type: predict_output, id: w08-predict-groupby-mean}
    orphan: false
  - id: w07-trap-wp2-1-find-returns-number
    week: 7
    waypoint: w07-wp2
    kind: misconception
    text: "`.find()` returns a number, so `line.find(x) == True` is never true. Use `in` for yes/no and `.find()` for position."
    tested_by:
      - {type: predict_output, id: w09-predict-find-truthy}
    orphan: false
  - id: w07-trap-wp2-2-1-truthy-always
    week: 7
    waypoint: w07-wp2
    kind: misconception
    text: "`-1` is truthy. Always compare explicitly: `if line.find(x) != -1:`."
    tested_by:
      - {type: predict_output, id: w09-predict-find-truthy}
    orphan: false
  - id: w07-trap-wp2-3-replace-case-sensitive
    week: 7
    waypoint: w07-wp2
    kind: misconception
    text: "`.replace()` and `in` are case-sensitive. `.lower()` first if the case should not matter."
    tested_by:
      - {type: predict_output, id: w09-predict-find-truthy}
    orphan: false
  - id: w07-trap-wp2-4-startswith-needs-exact
    week: 7
    waypoint: w07-wp2
    kind: misconception
    text: "`.startswith()` needs the exact prefix at position 0. If the text merely contains it, you wanted `in`."
    tested_by:
      - {type: predict_output, id: w09-predict-find-truthy}
    orphan: false
  - id: w07-trap-wp4-1-assuming-every-line
    week: 7
    waypoint: w07-wp4
    kind: misconception
    text: "Assuming every line is well-formed guarantees a 2 AM surprise. Test the three failures before they happen live."
    tested_by:
      - {type: py_exercise, id: w07-pipeline-first-steps}
      - {type: predict_output, id: w10-predict-maxsplit-clean}
    orphan: false
  - id: w07-trap-wp4-2-clean-before-convert
    week: 7
    waypoint: w07-wp4
    kind: runtime_error
    text: "Clean before you convert. Calling `.strip()` on a float raises `AttributeError`, because numbers have no string methods."
    tested_by:
      - {type: py_exercise, id: w07-pipeline-first-steps}
      - {type: predict_output, id: w10-predict-maxsplit-clean}
    orphan: false
  - id: w07-trap-wp4-3-three-line-chain
    week: 7
    waypoint: w07-wp4
    kind: misconception
    text: "A three-line chain is unreadable when it breaks. Keep the pipeline as named steps, as above."
    tested_by:
      - {type: py_exercise, id: w07-pipeline-first-steps}
      - {type: predict_output, id: w10-predict-maxsplit-clean}
    orphan: false
  - id: w07-trap-wp4-4-repeating-over-limit
    week: 7
    waypoint: w07-wp4
    kind: misconception
    text: "Repeating the OVER LIMIT / WARNING / OK check inline for every line means the same logic typed twice, and eventually two versions that disagree. Write `status_of(...)` once."
    tested_by:
      - {type: py_exercise, id: w07-pipeline-first-steps}
      - {type: predict_output, id: w10-predict-maxsplit-clean}
    orphan: false
  - id: w08-trap-wp2-1-no-timeout-means
    week: 8
    waypoint: w08-wp2
    kind: misconception
    text: "No `timeout=` means an indefinite hang. Always set one."
    tested_by:
      - {type: py_exercise, id: w08-get-fallback}
    orphan: false
  - id: w08-trap-wp2-2-response-login-raises
    week: 8
    waypoint: w08-wp2
    kind: runtime_error
    text: "`response[\"login\"]` raises `TypeError: 'Response' object is not subscriptable`. Call `.json()` first."
    tested_by:
      - {type: py_exercise, id: w08-get-fallback}
    orphan: false
  - id: w08-trap-wp2-3-key-json-raises
    week: 8
    waypoint: w08-wp2
    kind: runtime_error
    text: "A key that is not in the JSON raises `KeyError`. Print the whole dict once and read the real field names, then use `.get(key, default)` only for genuinely optional fields."
    tested_by:
      - {type: py_exercise, id: w08-get-fallback}
    orphan: false
  - id: w08-trap-wp2-4-building-query-string
    week: 8
    waypoint: w08-wp2
    kind: misconception
    text: "Building the query string by hand works often enough to be dangerous. Let `requests` do it."
    tested_by:
      - {type: py_exercise, id: w08-get-fallback}
    orphan: false
  - id: w08-trap-wp3-1-using-blob-url
    week: 8
    waypoint: w08-wp3
    kind: misconception
    text: "Using the `blob` URL instead of `raw` gives you HTML, not data."
    tested_by:
      - {type: py_exercise, id: w08-stringio-rows}
    orphan: false
  - id: w08-trap-wp3-2-passing-response-text
    week: 8
    waypoint: w08-wp3
    kind: runtime_error
    text: "Passing `response.text` straight to `read_csv` raises `TypeError`. Wrap it in `StringIO`."
    tested_by:
      - {type: py_exercise, id: w08-stringio-rows}
    orphan: false
  - id: w08-trap-wp3-3-kaggle-one-requests
    week: 8
    waypoint: w08-wp3
    kind: operational
    text: "Kaggle is not one `requests.get()`. It needs an account, `pip install kaggle`, and a token, then `kaggle datasets download -d owner/name`."
    tested_by:
      - {type: py_exercise, id: w08-stringio-rows}
    orphan: false
  - id: w08-trap-wp3-4-file-host-own
    week: 8
    waypoint: w08-wp3
    kind: misconception
    text: "A file you host in your own repo works exactly like the raw GitHub case. Nothing is special about who owns it."
    tested_by:
      - {type: py_exercise, id: w08-stringio-rows}
    orphan: false
  - id: w09-trap-wp3-1-pbkdf2-nist-approved
    week: 9
    waypoint: w09-wp3
    kind: security
    text: "**PBKDF2 is the NIST-approved fallback for when you cannot use memory-hard hashing. Modern production systems should use Argon2id (or scrypt), which resist GPU cracking far better than PBKDF2 at comparable CPU cost. We teach PBKDF2 here because it is in the Python standard library and the mechanics are visible; in production, reach for `argon2-cffi` (or `bcrypt`, which embeds its salt in a 60-character string and silently truncates inputs above 72 bytes).**"
    tested_by:
      - {type: predict_output, id: w11-predict-pbkdf2-salt}
    orphan: false
  - id: w09-trap-wp3-2-passing-str-instead
    week: 9
    waypoint: w09-wp3
    kind: runtime_error
    text: "Passing a `str` instead of `bytes` to `pbkdf2_hmac` raises `TypeError`. Encode the password with `.encode(\"utf-8\")` first."
    tested_by:
      - {type: predict_output, id: w11-predict-pbkdf2-salt}
    orphan: false
  - id: w09-trap-wp3-3-reusing-single-static
    week: 9
    waypoint: w09-wp3
    kind: security
    text: "Reusing a single static salt across users lets an attacker build one rainbow table for your entire userbase. Call `secrets.token_bytes(16)` per user registration."
    tested_by:
      - {type: predict_output, id: w11-predict-pbkdf2-salt}
    orphan: false
  - id: w09-trap-wp3-4-comparing-password-digests
    week: 9
    waypoint: w09-wp3
    kind: security
    text: "Comparing password digests with `==` instead of `hmac.compare_digest()` leaks byte-by-byte timing differences."
    tested_by:
      - {type: predict_output, id: w11-predict-pbkdf2-salt}
    orphan: false
  - id: w09-trap-wp4-1-split-maxsplit-raises
    week: 9
    waypoint: w09-wp4
    kind: runtime_error
    text: "`.split(\",\")` without a maxsplit raises `ValueError: too many values to unpack` on a line with an extra comma. Use `.split(\",\", 1)`."
    tested_by:
      - {type: py_exercise, id: w09-store-split}
      - {type: py_exercise, id: w09-env-read}
      - {type: predict_output, id: w12-predict-register-toctou}
    orphan: false
  - id: w09-trap-wp4-2-allowing-duplicate-usernames
    week: 9
    waypoint: w09-wp4
    kind: misconception
    text: "Allowing duplicate usernames means login silently authenticates against the first record forever. Even with `if username_exists():`, a check-then-act sequence in memory or on flat files has a race condition (TOCTOU) when two requests register the same username concurrently; in production, enforce uniqueness atomically with a database `UNIQUE` constraint (Week 10 / Week 20)."
    tested_by:
      - {type: py_exercise, id: w09-store-split}
      - {type: py_exercise, id: w09-env-read}
      - {type: predict_output, id: w12-predict-register-toctou}
    orphan: false
  - id: w09-trap-wp4-3-returning-false-immediately
    week: 9
    waypoint: w09-wp4
    kind: security
    text: "Returning `False` immediately before hashing when a username is not found leaks whether the account exists via response latency (timing oracle)."
    tested_by:
      - {type: py_exercise, id: w09-store-split}
      - {type: py_exercise, id: w09-env-read}
      - {type: predict_output, id: w12-predict-register-toctou}
    orphan: false
  - id: w09-trap-wp4-4-printing-password-even
    week: 9
    waypoint: w09-wp4
    kind: security
    text: "Printing a password, even while debugging, puts it in your terminal history and your logs. Print confirmations, never values."
    tested_by:
      - {type: py_exercise, id: w09-store-split}
      - {type: py_exercise, id: w09-env-read}
      - {type: predict_output, id: w12-predict-register-toctou}
    orphan: false
  - id: w09-trap-wp4-5-gitignore-added-after
    week: 9
    waypoint: w09-wp4
    kind: operational
    text: "A `.gitignore` added after the file was committed is too late. The file is already tracked; `git rm --cached` is on top of that."
