    orphan: false
  - id: w03-trap-wp4-4-test-code-at
    week: 3
    waypoint: w03-wp4
    kind: misconception
    text: "Test code at the top level runs on every import. Put it behind the guard, or the next engineer gets your debug output in their logs."
    tested_by:
      - {type: predict_output, id: w05-predict-import-shadow}
    orphan: false
  - id: w03-trap-wp4-5-modulenotfounderror-real-package
    week: 3
