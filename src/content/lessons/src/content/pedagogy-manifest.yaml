    waypoint: w15-wp4
    kind: misconception
    text: "Returning internal Python tracebacks or SQLite error strings in `detail`. Log the full exception server-side and return a safe message to the caller."
    tested_by:
      - {type: predict_output, id: w17-predict-endpoint-di}
    orphan: false
  - id: w15-trap-wp4-3-forgetting-test-404
    week: 15
    waypoint: w15-wp4
    kind: misconception
    text: "Forgetting to test `404` and `422` paths alongside `200` and `201`. Error paths are where unhandled exceptions hide."
    tested_by:
      - {type: predict_output, id: w17-predict-endpoint-di}
    orphan: false
  - id: w16-trap-wp2-1-writing-h-hosts
    week: 16
    waypoint: w16-wp2
    kind: misconception
    text: "Writing `for h in hosts: await probe(h)` and expecting concurrency. That runs one coroutine at a time. Collect the coroutines and `await asyncio.gather(*tasks)`."
    tested_by:
      - {type: py_exercise, id: w16-gather-order}
    orphan: false
  - id: w16-trap-wp2-2-calling-time-sleep
    week: 16
    waypoint: w16-wp2
    kind: misconception
    text: "Calling `time.sleep()` or `requests.get()` inside an `async def` function. Both are synchronous and freeze the entire event loop, starving every other concurrent task. Use `await asyncio.sleep()` and an async HTTP client like `httpx.AsyncClient`."
    tested_by:
      - {type: py_exercise, id: w16-gather-order}
    orphan: false
  - id: w16-trap-wp2-3-forgetting-await-task
    week: 16
    waypoint: w16-wp2
    kind: misconception
    text: "Forgetting `await` on a task that mutates state or sends an alert. Python emits `RuntimeWarning: coroutine '...' was never awaited` and the code inside never runs."
    tested_by:
      - {type: py_exercise, id: w16-gather-order}
    orphan: false
  - id: w16-trap-wp4-1-creating-new-asyncio
    week: 16
    waypoint: w16-wp4
    kind: misconception
    text: "Creating a new `asyncio.Semaphore(5)` inside the worker function instead of creating one shared semaphore outside and passing it in. Five separate semaphores of size 5 do not limit anything."
    tested_by:
      - {type: py_exercise, id: w16-semaphore-peak}
    orphan: false
  - id: w16-trap-wp4-2-opening-new-http
    week: 16
    waypoint: w16-wp4
    kind: misconception
    text: "Opening a new HTTP client session inside every single coroutine (`async with httpx.AsyncClient() as client:` inside `bounded_probe`). Create one shared `AsyncClient` outside `gather` so all requests reuse the same TCP connection pool."
    tested_by:
      - {type: py_exercise, id: w16-semaphore-peak}
    orphan: false
  - id: w16-trap-wp4-3-using-asyncio-speed
    week: 16
    waypoint: w16-wp4
    kind: misconception
    text: "Using `asyncio` to speed up heavy CPU math. Event loops overlap *waiting*, not calculation; CPU-bound work belongs in `concurrent.futures.ProcessPoolExecutor`."
    tested_by:
      - {type: py_exercise, id: w16-semaphore-peak}
    orphan: false
  - id: w17-trap-wp2-1-iterating-over-same
    week: 17
    waypoint: w17-wp2
    kind: misconception
    text: "Iterating over the same generator object twice. A generator is a one-way stream: once `list(gen)` or `sum(gen)` exhausts it, a second loop over `gen` yields zero items and raises no error."
    tested_by:
      - {type: py_exercise, id: w17-exhausted-generator}
    orphan: false
  - id: w17-trap-wp2-2-calling-len-gen
    week: 17
    waypoint: w17-wp2
    kind: misconception
    text: "Calling `len(gen)` or indexing `gen[0]`. Generators do not know their length in advance and do not support indexing; use `sum(1 for _ in gen)` to count items or `next(gen)` to grab the first one."
    tested_by:
      - {type: py_exercise, id: w17-exhausted-generator}
    orphan: false
  - id: w17-trap-wp2-3-wrapping-generator-inside
    week: 17
    waypoint: w17-wp2
    kind: misconception
    text: "Wrapping a generator inside `list()` before passing it to `sum()`, `max()`, or `any()`, which throws away the memory savings you just wrote the generator to get."
    tested_by:
      - {type: py_exercise, id: w17-exhausted-generator}
    orphan: false
  - id: w17-trap-wp4-1-opening-file-inside
    week: 17
    waypoint: w17-wp4
    kind: runtime_error
    text: "Opening a file inside a helper function, returning a generator expression over `f`, and letting the `with open(...) as f:` block exit before the caller consumes the generator. The file closes immediately and iterating raises `ValueError: I/O operation on closed file`. Put `yield` *inside* the `with open(...)` block so the generator keeps the context manager alive until iteration stops."
    tested_by:
      - {type: py_exercise, id: w17-jsonl-generator}
    orphan: false
  - id: w17-trap-wp4-2-calling-json-load
    week: 17
    waypoint: w17-wp4
    kind: runtime_error
    text: "Calling `json.load(f)` on a `.jsonl` file. `json.load()` expects a single top-level JSON document and raises `json.JSONDecodeError: Extra data` on line 2. Loop over `f` and call `json.loads(line)` on each line."
    tested_by:
      - {type: py_exercise, id: w17-jsonl-generator}
    orphan: false
  - id: w18-trap-wp2-1-forgetting-return-func
    week: 18
    waypoint: w18-wp2
    kind: misconception
    text: "Forgetting `return func(*args, **kwargs)` inside `wrapper`. Your decorated function runs its side effects and silently returns `None` to every caller."
    tested_by:
      - {type: py_exercise, id: w18-retry-counter}
    orphan: false
  - id: w18-trap-wp2-2-writing-retry-parentheses
    week: 18
    waypoint: w18-wp2
    kind: runtime_error
    text: "Writing `@retry` without parentheses when `retry` is a decorator factory expecting `@retry()`. Calling `flaky_ping(\"srv-07\")` then passes `\"srv-07\"` as `func` and crashes with `TypeError`."
    tested_by:
      - {type: py_exercise, id: w18-retry-counter}
    orphan: false
  - id: w18-trap-wp2-3-retrying-bare-except
    week: 18
    waypoint: w18-wp2
    kind: runtime_error
    text: "Retrying on bare `except Exception:`. A typo raising `NameError` or a `401 Unauthorized` will never succeed on retry 2 or 3; retry only transient network/IO errors."
    tested_by:
      - {type: py_exercise, id: w18-retry-counter}
    orphan: false
  - id: w18-trap-wp3-1-omitting-try-finally
    week: 18
    waypoint: w18-wp3
    kind: misconception
    text: "Omitting `try: ... finally:` around `yield` in a `@contextmanager` function. If the code inside the `with` block raises an exception, Python injects that exception at the `yield` point and any cleanup lines below `yield` never execute unless they are inside `finally:`."
    tested_by:
      - {type: py_exercise, id: w18-contextmanager-cleanup}
      - {type: predict_output, id: w21-predict-contextmanager-finally}
    orphan: false
  - id: w18-trap-wp3-2-yielding-more-than
    week: 18
    waypoint: w18-wp3
    kind: runtime_error
    text: "Yielding more than once inside `@contextmanager`, which raises `RuntimeError: generator didn't stop`. A context manager yields control to the `with` block exactly once."
    tested_by:
      - {type: py_exercise, id: w18-contextmanager-cleanup}
      - {type: predict_output, id: w21-predict-contextmanager-finally}
    orphan: false
  - id: w19-trap-wp2-1-logging-sensitive-fields
    week: 19
    waypoint: w19-wp2
    kind: security
    text: "Logging sensitive fields like `password`, `api_key`, or `Authorization` headers when dumping `**fields` or request dictionaries. Redact secrets before serializing."
    tested_by:
      - {type: py_exercise, id: w19-redact-structured-log}
    orphan: false
  - id: w19-trap-wp2-2-calling-logger-error
    week: 19
    waypoint: w19-wp2
    kind: misconception
    text: "Calling `logger.error(f\"Failed: {exc}\")` instead of `logger.exception(\"Failed\")` inside an `except` block. `logger.exception()` attaches the full stack trace automatically; `str(exc)` throws away the line number where the error happened."
    tested_by:
      - {type: py_exercise, id: w19-redact-structured-log}
    orphan: false
  - id: w19-trap-wp2-3-configuring-logging-basicconfig
    week: 19
    waypoint: w19-wp2
    kind: misconception
    text: "Configuring `logging.basicConfig()` at the top of a shared library module. Only the application entrypoint should configure handlers and levels."
    tested_by:
      - {type: py_exercise, id: w19-redact-structured-log}
    orphan: false
  - id: w19-trap-wp4-1-using-time-time
    week: 19
    waypoint: w19-wp4
    kind: misconception
    text: "Using `time.time()` to measure duration. A clock sync mid-request can produce a negative latency (`-12.4ms`) and corrupt your metrics. Use `time.perf_counter()`."
    tested_by:
      - {type: predict_output, id: w21-predict-monotonic-timer}
    orphan: false
  - id: w19-trap-wp4-2-unbounded-metric-labels
    week: 19
    waypoint: w19-wp4
    kind: misconception
    text: "Unbounded metric labels (putting a unique `request_id` or timestamp inside a counter name like `metrics.inc(f\"req_{request_id}\")`). Your dictionary grows forever until the process runs out of memory. Keep counter names to a small fixed vocabulary (`\"db_write.ok\"`, `\"db_write.err\"`) and put high-cardinality IDs in logs."
    tested_by:
      - {type: predict_output, id: w21-predict-monotonic-timer}
    orphan: false
  - id: w20-trap-wp2-1-checking-if-job
    week: 20
    waypoint: w20-wp2
    kind: misconception
    text: "Checking if a job was already processed in memory when running multiple worker processes that do not share RAM. In production, store the `idempotency_key` in a shared database table with a `PRIMARY KEY` or `UNIQUE` constraint."
    tested_by:
      - {type: py_exercise, id: w20-idempotent-sql}
      - {type: predict_output, id: w23-predict-idempotent-retry}
    orphan: false
  - id: w20-trap-wp2-2-generating-brand-new
    week: 20
    waypoint: w20-wp2
    kind: misconception
    text: "Generating a brand-new random `job_id` every time a worker retries a failed task. The idempotency key must be deterministic for the event (for example, `f\"{host}:{timestamp_minute}\"`) so retries carry the same key."
    tested_by:
      - {type: py_exercise, id: w20-idempotent-sql}
      - {type: predict_output, id: w23-predict-idempotent-retry}
    orphan: false
  - id: w20-trap-wp4-1-unbounded-exponential-backoff
    week: 20
    waypoint: w20-wp4
    kind: misconception
    text: "Unbounded exponential backoff (`2 ** attempt` without `min(cap, ...)`). By attempt 20, the worker sleeps for twelve days. Always cap the maximum delay."
    tested_by:
      - {type: py_exercise, id: w20-capped-backoff}
    orphan: false
  - id: w20-trap-wp4-2-enqueueing-huge-payloads
    week: 20
    waypoint: w20-wp4
    kind: misconception
    text: "Enqueueing huge payloads (like a 20 MB CSV string) directly inside the queue message. Write the large payload to disk or object storage and pass only its file path or database ID in the queue message."
    tested_by:
      - {type: py_exercise, id: w20-capped-backoff}
    orphan: false
  - id: w20-trap-wp4-3-killing-worker-process
    week: 20
    waypoint: w20-wp4
    kind: misconception
    text: "Killing a worker process mid-job without a graceful shutdown flag (`running = False`), leaving half-written state behind. Let the worker finish its current item before exiting the loop."
    tested_by:
      - {type: py_exercise, id: w20-capped-backoff}
    orphan: false
  - id: w21-trap-wp2-1-calling-conn-commit
    week: 21
    waypoint: w21-wp2
    kind: misconception
    text: "Calling `conn.commit()` manually after every single statement inside a multi-step update. Once committed, a later exception in the block cannot roll back the earlier statement. Let the `with conn:` block commit once at the end."
    tested_by:
      - {type: py_exercise, id: w21-atomic-transfer}
    orphan: false
  - id: w21-trap-wp2-2-creating-index-every
    week: 21
    waypoint: w21-wp2
    kind: misconception
    text: "Creating an index on every column \"just in case\". Every index speeds up matching `SELECT` queries but slows down every `INSERT`, `UPDATE`, and `DELETE` because SQLite must update all those index trees on every write. Index the columns you actually filter (`WHERE`), join (`ON`), or sort (`ORDER BY`) by."
    tested_by:
      - {type: py_exercise, id: w21-atomic-transfer}
    orphan: false
  - id: w21-trap-wp2-3-wrapping-lower-hostname
    week: 21
    waypoint: w21-wp2
    kind: misconception
    text: "Wrapping `LOWER(hostname) = 'srv-01'` in the `WHERE` clause when the index is on `hostname`. Applying a function to the column prevents a standard column index from being used; normalize strings to lowercase before inserting them."
    tested_by:
      - {type: py_exercise, id: w21-atomic-transfer}
    orphan: false
  - id: w22-trap-wp2-1-computing-hmac-over
    week: 22
    waypoint: w22-wp2
    kind: misconception
    text: "Computing the HMAC over `json.dumps(parsed_dict)` instead of the exact raw request bytes. Whitespace or key-ordering differences change the hash and break valid signatures."
    tested_by:
      - {type: py_exercise, id: w22-hmac-tamper}
    orphan: false
  - id: w22-trap-wp2-2-verifying-hmac-signature
    week: 22
    waypoint: w22-wp2
    kind: security
    text: "Verifying the HMAC signature without checking the timestamp (`0 <= now - timestamp <= max_skew`), or forgets to deduplicate the signature/event ID in Week 20's idempotency store. An attacker who intercepts one valid signed request can replay that exact request unless you reject stale timestamps and duplicate IDs."
    tested_by:
      - {type: py_exercise, id: w22-hmac-tamper}
    orphan: false
  - id: w22-trap-wp3-1-storing-one-bucket
    week: 22
    waypoint: w22-wp3
    kind: misconception
    text: "Storing one bucket per IP in an unbounded `dict` (`self.buckets`). During a spoofed-IP flood, millions of unique keys will exhaust RAM\u2014the exact high-cardinality trap from Week 19. In production, store buckets in Week 21's `TTLCache` (or Redis with `EXPIRE`) so idle IP entries evict automatically."
    tested_by:
      - {type: py_exercise, id: w22-fixed-window-limiter}
    orphan: false
  - id: w22-trap-wp4-1-using-shell-true
    week: 22
    waypoint: w22-wp4
    kind: security
    text: "Using `shell=True` in `subprocess.run()` with any string that came from a request, file, or database row. Pass an argument list `[\"cmd\", arg1, arg2]` with `shell=False`."
    tested_by:
      - {type: py_exercise, id: w22-path-jail}
    orphan: false
  - id: w22-trap-wp4-2-checking-filename-string
    week: 22
    waypoint: w22-wp4
    kind: misconception
    text: "Checking `\"..\" not in filename` with string replacement instead of `.resolve().is_relative_to(root)`. Symlinks and URL encodings bypass naive string filters; `.resolve()` canonicalizes the real path first."
    tested_by:
      - {type: py_exercise, id: w22-path-jail}
    orphan: false
  - id: w23-trap-wp2-1-sharing-single-module
    week: 23
    waypoint: w23-wp2
    kind: misconception
    text: "Sharing a single module-level database or dictionary across tests without resetting it. Test B passes when run after Test A and fails when run alone (`pytest -k test_b`). Every test must set up its own state."
    tested_by:
      - {type: py_exercise, id: w23-assert-raises}
    orphan: false
  - id: w23-trap-wp2-2-catching-exceptions-try
    week: 23
    waypoint: w23-wp2
    kind: runtime_error
    text: "Catching exceptions with `try: func() except ValueError: pass` when `func()` did not actually raise. If `func()` silently returns `None` instead of raising `ValueError`, the `try` block finishes normally and the test passes by mistake! Use `pytest.raises(ValueError)` or an explicit `raised = False` flag."
    tested_by:
      - {type: py_exercise, id: w23-assert-raises}
    orphan: false
  - id: w23-trap-wp4-1-asserting-exact-float
    week: 23
    waypoint: w23-wp4
    kind: misconception
    text: "Asserting exact float equality (`recovered_pct == pct`) on a lossy wire format like `:.2f`. Because `format_record` rounds `142.336` to `\"142.34\"`, the round-trip test must assert equivalence at the wire format's precision (`round(pct, 2)` or `pytest.approx(pct, abs=0.01)`), otherwise a bug in the test masquerades as a bug in the parser."
    tested_by:
      - {type: predict_output, id: w24-predict-roundtrip-precision}
    orphan: false
  - id: w24-trap-wp2-1-circular-imports-api
    week: 24
    waypoint: w24-wp2
    kind: misconception
    text: "Circular imports (`api.py` imports from `storage.py`, and `storage.py` imports from `api.py`). Python raises `ImportError: cannot import name '...' from partially initialized module`. Keep shared data classes in `domain.py` so both `api.py` and `storage.py` import downward from `domain.py`, never sideways from each other."
    tested_by:
      - {type: py_exercise, id: w24-entrypoint-parse}
    orphan: false
  - id: w24-trap-wp2-2-naming-local-file
    week: 24
    waypoint: w24-wp2
    kind: misconception
    text: "Naming a local file `logging.py`, `json.py`, `random.py`, or `sqlite3.py`. It shadows the Python standard library module of the same name and breaks every library that tries to import it."
    tested_by:
      - {type: py_exercise, id: w24-entrypoint-parse}
    orphan: false
  - id: w24-trap-wp2-3-unpinned-dependencies-upper
    week: 24
    waypoint: w24-wp2
    kind: misconception
    text: "Unpinned dependencies without upper or lower bounds (`pandas` instead of `pandas>=2.0,<3.0`), which lets an overnight major version bump break a fresh deployment."
    tested_by:
      - {type: py_exercise, id: w24-entrypoint-parse}
    orphan: false
