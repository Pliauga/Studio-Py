    tested_by:
      - {type: py_exercise, id: w14-quarantine-batch}
      - {type: predict_output, id: w24-predict-post-init-quarantine}
    orphan: false
  - id: w14-trap-wp4-3-mutating-caller-s
    week: 14
    waypoint: w14-wp4
    kind: misconception
    text: "Mutating the caller's input dictionary inside `from_raw()` with `.pop()`. Read from the dictionary without destroying it in case the error handler needs to log the raw payload."
    tested_by:
      - {type: py_exercise, id: w14-quarantine-batch}
      - {type: predict_output, id: w24-predict-post-init-quarantine}
    orphan: false
